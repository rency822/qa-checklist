<!DOCTYPE html>
<html>
<head>
   <style>
        body { font-family: Arial, sans-serif; }
        .extra-input { margin-left: 8px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>

<h3>Date:</h3>
<input type="date" id="sceneDate">

<h3>Type:</h3>
<button onclick="setType('SCENES')" id="sceneBtn">SCENES</button>
<button onclick="setType('TRAILER')" id="trailerBtn">TRAILER</button>

<h3>Scene Code:</h3>
<input type="text" id="sceneCode">

<h3> Manage Issues
    <button onclick="toggleIssueManager()" id="toggleBtn">
        Show
    </button>
   
</h3>

<div id="issueManagerSection" style="display:none;">
    <input type="text" id="newIssueInput" placeholder="New issue name">
    <button onclick="addNewIssue()">Add</button><br><br>

    <ul id="issueManager"></ul>
     <button onclick="exportIssues()">Export Issues</button><br><br>
    <label>
    Import Issues:
    <input type="file" id="importIssuesInput" accept=".json" onchange="importIssues(event)">
</label>
</div>

<h3>Add Issue:</h3>
<input type="text" id="searchInput" placeholder="Search issue..." oninput="filterIssues()">

<ul id="searchResults"></ul>

<h3>Selected Issues</h3>
<ul id="selectedList"></ul>

<button id="generateBtn" onclick="generateOutput()" disabled>Generate Output</button>
<button onclick="clearInputs()">Clear Inputs</button>


<p id="copyStatus" style="color: green;"></p>

<h3>Output: <button onclick="exportAllCompiled()">Export All (Scenes + Trailer)</button>
</h3>
<pre id="output"></pre>

<style>
ul { list-style: none; padding: 0; }
li { margin-bottom: 6px; }
.issue-item { cursor: pointer; color: #2b7cff; }
.remove-btn { margin-left: 8px; color: red; cursor: pointer; }
input.link-input { margin-left: 8px; }
</style>

<div id="compiledScenesSection">
    <h3>Compiled Output – SCENES</h3>
    <textarea id="compiledScenes" rows="15" style="width:100%;"></textarea><br>
    <button onclick="copyCompiled('SCENES')">Copy Scenes</button>
    <button onclick="clearCompiled('SCENES')">Clear Scenes</button>
    <button onclick="saveEditedCompiled('SCENES')">Save Edited Scenes</button>
</div>

<div id="compiledTrailersSection" style="display:none;">
    <h3>Compiled Output – TRAILER</h3>
    <textarea id="compiledTrailers" rows="15" style="width:100%;"></textarea><br>
    <button onclick="copyCompiled('TRAILER')">Copy Trailer</button>
    <button onclick="clearCompiled('TRAILER')">Clear Trailer</button>
    <button onclick="saveEditedCompiled('TRAILER')">Save Edited Trailer</button>
</div>



<!-- IMPORTANT: data file FIRST -->
<script src="checkboxData.js"></script>
<script src="main.js"></script>

</body>
</html>
